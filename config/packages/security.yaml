security:
    # https://symfony.com/doc/current/security.html#registering-the-user-hashing-passwords
    password_hashers:
        Symfony\Component\Security\Core\User\PasswordAuthenticatedUserInterface: 'auto'

    providers:
        app_user_provider:
            entity:
                class: App\Entity\User
                property: email

    role_hierarchy:
        ROLE_ADMIN: [ROLE_USER]

    firewalls:
        dev:
            pattern: ^/(_(profiler|wdt)|css|images|js|assets|bundles)/
            security: false

        main:
            lazy: true
            provider: app_user_provider
            custom_authenticator: App\Security\LoginAuthenticator
            login_throttling:
                max_attempts: 5
                interval: '15 minutes'
            remember_me:
                secret: '%kernel.secret%'
                lifetime: 1209600
                path: /
            logout:
                path: app_logout
                target: home.index
                invalidate_session: true

    # Seule la PREMIÈRE règle qui correspond est appliquée.
    access_control:
        # Pages publiques
        - { path: ^/$, roles: PUBLIC_ACCESS }
        - { path: ^/(login|register|contact)$, roles: PUBLIC_ACCESS }
        - { path: ^/(media|assets|images|bundles|favicon), roles: PUBLIC_ACCESS }
        - { path: ^/_error, roles: PUBLIC_ACCESS }

        # Back-office
        - { path: ^/admin, roles: ROLE_ADMIN }

        # Tout le reste nécessite un compte
        - { path: ^/, roles: ROLE_USER }

when@test:
    security:
        password_hashers:
            # Les hachages coûteux ralentissent les tests : on réduit le coût.
            Symfony\Component\Security\Core\User\PasswordAuthenticatedUserInterface:
                algorithm: auto
                cost: 4
                time_cost: 3
                memory_cost: 10
