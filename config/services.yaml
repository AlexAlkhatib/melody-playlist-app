# Configuration des services applicatifs.
# https://symfony.com/doc/current/service_container.html

parameters:
    app.name: 'Melody'
    app.contact_email: '%env(CONTACT_TO_EMAIL)%'
    app.mailer_from: '%env(MAILER_FROM)%'

services:
    _defaults:
        autowire: true
        autoconfigure: true

    # Toutes les classes de src/ sont disponibles comme services.
    App\:
        resource: '../src/'
        exclude:
            - '../src/DependencyInjection/'
            - '../src/Entity/'
            - '../src/Kernel.php'

    # Paramètres injectés dans les contrôleurs via #[Autowire] / arguments nommés.
    App\Controller\ContactController:
        arguments:
            $contactEmail: '%app.contact_email%'
            $mailerFrom: '%app.mailer_from%'
