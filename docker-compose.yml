# ─────────────────────────────────────────────────────────────────────────────
# Melody — pile de production / préproduction
#   docker compose up -d --build      → http://localhost:8080
#   docker compose logs -f app
# ─────────────────────────────────────────────────────────────────────────────
services:
  app:
    build:
      context: .
      dockerfile: Dockerfile
    environment:
      APP_ENV: prod
      APP_DEBUG: 0
      APP_SECRET: ${APP_SECRET:-change-me-in-production}
      APP_URL: ${APP_URL:-http://localhost:8080}
      DATABASE_URL: mysql://${MYSQL_USER:-melody}:${MYSQL_PASSWORD:-melody}@database:3306/${MYSQL_DATABASE:-melody}?serverVersion=8.0.36&charset=utf8mb4
      MAILER_DSN: ${MAILER_DSN:-null://null}
      MAILER_FROM: ${MAILER_FROM:-Melody <no-reply@melody.local>}
      CONTACT_TO_EMAIL: ${CONTACT_TO_EMAIL:-contact@melody.local}
      RUN_MIGRATIONS: ${RUN_MIGRATIONS:-1}
    volumes:
      # Les fichiers publics (assets + uploads) sont partagés avec nginx.
      - public-data:/var/www/html/public
    depends_on:
      database:
        condition: service_healthy
    restart: unless-stopped

  web:
    image: nginx:1.27-alpine
    ports:
      - "${HTTP_PORT:-8080}:80"
    volumes:
      - ./docker/nginx/default.conf:/etc/nginx/conf.d/default.conf:ro
      - public-data:/var/www/html/public:ro
    depends_on:
      - app
    restart: unless-stopped

  database:
    image: mysql:8.0
    environment:
      MYSQL_DATABASE: ${MYSQL_DATABASE:-melody}
      MYSQL_USER: ${MYSQL_USER:-melody}
      MYSQL_PASSWORD: ${MYSQL_PASSWORD:-melody}
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:-root}
    volumes:
      - db-data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "127.0.0.1", "-u", "root", "-p${MYSQL_ROOT_PASSWORD:-root}"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 30s
    restart: unless-stopped

volumes:
  db-data:
  public-data:
