server {
    listen 80;
    server_name _;

    root /var/www/html/public;
    index index.php;

    charset utf-8;
    client_max_body_size 24M;

    # Journaux
    access_log /var/log/nginx/access.log;
    error_log  /var/log/nginx/error.log warn;

    # Front controller Symfony
    location / {
        try_files $uri /index.php$is_args$args;
    }

    location ~ ^/index\.php(/|$) {
        fastcgi_pass app:9000;
        fastcgi_split_path_info ^(.+\.php)(/.*)$;
        include fastcgi_params;

        fastcgi_param SCRIPT_FILENAME $document_root$fastcgi_script_name;
        fastcgi_param DOCUMENT_ROOT $document_root;
        fastcgi_param HTTPS $https if_not_empty;

        internal;
    }

    # Aucun autre fichier PHP ne doit être exécuté
    location ~ \.php$ {
        return 404;
    }

    # Fichiers statiques : cache long
    location ~* \.(?:css|js|jpg|jpeg|png|gif|webp|ico|svg|woff2?|ttf|eot|mp3|ogg|wav|flac|midi)$ {
        expires 30d;
        add_header Cache-Control "public, immutable";
        try_files $uri =404;
    }

    # Uploads : jamais exécutés, cache 30 jours
    location /media/ {
        try_files $uri =404;
        expires 30d;
        add_header Cache-Control "public";
        add_header X-Content-Type-Options nosniff;
    }

    location = /favicon.ico { access_log off; log_not_found off; }
    location = /robots.txt  { access_log off; log_not_found off; }

    gzip on;
    gzip_types text/plain text/css application/javascript application/json image/svg+xml;
    gzip_min_length 1024;
}
